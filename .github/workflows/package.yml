name: Build release packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: python -m pip install build
      - run: python -m build
      - name: Check installed CLI
        run: |
          python -m venv /tmp/epub-cli
          /tmp/epub-cli/bin/pip install dist/*.whl
          /tmp/epub-cli/bin/epub-merge --help
      - run: npm run build:web:pages
      - uses: actions/upload-artifact@v4
        with:
          name: epub-toolkit-1.0.0
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist-web/
