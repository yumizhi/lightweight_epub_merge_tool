name: Build release packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: python -m pip install build
      - run: python -m build
      - run: npm run package:node
      - name: Check installed release CLIs
        run: |
          python -m venv /tmp/epub-cli
          /tmp/epub-cli/bin/pip install dist/*.whl
          npm install --prefix /tmp/epub-node ./dist/epub-toolkit-node-*.tgz
          python scripts/check-release.py --python-cli /tmp/epub-cli/bin/epub-merge --node-cli /tmp/epub-node/node_modules/.bin/epub-toolkit
      - run: npm run build:web:pages
      - uses: actions/upload-artifact@v4
        with:
          name: epub-toolkit-1.1.0
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.tgz
            CHANGELOG.md
            dist-web/
