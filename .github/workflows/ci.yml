name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Install EPUBCheck
        run: |
          curl --fail -L -o /tmp/epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          echo '33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c  /tmp/epubcheck.zip' | sha256sum -c -
          unzip -q /tmp/epubcheck.zip -d /tmp
      - name: Types, core tests, CLI tests, EPUBCheck and builds
        run: npm run verify
        env:
          EPUBCHECK_JAR: /tmp/epubcheck-5.4.0/epubcheck.jar
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test the production app at the Pages path
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
